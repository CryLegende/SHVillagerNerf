name: SHVillagerNerf
version: '${project.version}'
main: org.Cry_Legende.sHVillagerNerf.SHVillagerNerf
api-version: '1.20'
author: Cry_Legende
description: Modifie divers aspects du comportement des villageois.

commands:
  shvillagernerf:
    description: Recharge la configuration du plugin SHVillagerNerf.
    usage: /shvillagernerf reload
    permission: shvillagernerf.reload

permissions:
  shvillagernerf.reload:
    description: Permet de recharger la configuration du plugin.
    default: op
